# docker-compose para hostear resolver-ar en cualquier VPS/servidor con Docker.
#
#   cp deploy/.env.example deploy/.env   # y completá RESOLVER_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Funciona SIN padrón (panel/stock/bot). Para tener /texto y /lote, copiá
# datos/padron.db a ./datos/padron.db y descomentá el montaje del padrón.
services:
  resolver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: resolver-ar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      RESOLVER_STOCK_DB: /app/datos/stock.db
      RESOLVER_DB: /app/datos/padron.db
    volumes:
      # Datos persistentes: stock.db (obligatorio) y padron.db (opcional).
      - ../datos:/app/datos
    ports:
      - "127.0.0.1:3001:3001"   # detrás de un reverse proxy (Caddy/nginx) en el host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health?token='+process.env.RESOLVER_TOKEN).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
