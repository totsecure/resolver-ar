# litestream.yml — replicación continua de stock.db (solo stock.db).
# padron.db es estática y ya tiene backup semanal: no se replica.
# Destino local en el disco externo; el wrapper espera el montaje al arrancar.
dbs:
  - path: /Volumes/Boveda/resolver/datos/stock.db
    replica:
      path: /Volumes/Boveda/litestream/stock
