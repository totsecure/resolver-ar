<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Stock · RESOLVER</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#dfe3e8;--txt:#101720;--dim:#5b6675;--acc:#2563eb;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{font-weight:800;letter-spacing:.4px}.marca b{color:var(--acc)}
.der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.numero{background:#f7f9fb;border:1px solid var(--line);border-radius:11px;padding:10px}
.numero b{display:block;font-size:20px}
.numero span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700}
input{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px}
input:focus{outline:none;border-color:var(--acc)}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
.tabla td{padding:8px;border-bottom:1px solid #eef1f4}
.tabla tr:last-child td{border-bottom:0}
.bin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}
.n{font-weight:800;color:var(--ok)}
.banco{color:var(--dim)}
.vacio{color:var(--dim);text-align:center;padding:26px 0}
button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:10px 13px;font-weight:700;font-size:14px;cursor:pointer}
button.sec{background:#fff;color:var(--txt);border:1px solid var(--line)}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chips .etq{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700;align-self:center;margin-right:3px}
.chips button{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pie{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
a{color:var(--acc)}
/* Celular: la tabla se apila y el banco no se estira en cinco renglones. */
@media(max-width:640px){
  .tabla thead{display:none}
  .tabla tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"bin banco cant" "bin saldo saldo";gap:2px 10px;padding:9px 2px;border-bottom:1px solid #eef1f4}
  .tabla td{padding:0;border:0}
  .tabla td:nth-child(1){grid-area:bin}
  .tabla td:nth-child(2){grid-area:banco;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .tabla td:nth-child(3){grid-area:cant;text-align:right}
  .tabla td:nth-child(4){grid-area:saldo;font-size:12.5px}
  .tabla tr:last-child{border-bottom:0}
  .tabla td.vacio{grid-area:auto;grid-column:1/-1}
}
</style>
</head>
<body>
<header>
  <div class="marca">RESOLVER <b>stock</b></div>
  <div class="der"><button class="sec" id="refrescar">Actualizar</button></div>
</header>
<main>
  <div class="tarjeta">
    <h1>Tarjetas disponibles</h1>
    <p class="sub">Stock abierto y sin precios: cada vendedor tiene su arreglo. Lo que ves es lo que hay hoy.</p>
    <div class="numeros">
      <div class="numero"><b id="tot">–</b><span>tarjetas</span></div>
      <div class="numero"><b id="bins">–</b><span>BIN</span></div>
      <div class="numero"><b id="saldo">–</b><span>saldo máximo</span></div>
    </div>
    <div class="cta">
      <a href="/registro"><button>Quiero vender</button></a>
      <a href="/login"><button class="sec">Ya tengo cuenta</button></a>
      <a id="bot" href="#" target="_blank" rel="noopener"><button class="sec">Bot de Telegram</button></a>
    </div>
  </div>

  <div class="tarjeta">
    <input id="busca" placeholder="Filtrar por BIN o banco…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <div class="tarjeta">
    <table class="tabla">
      <thead><tr><th>BIN</th><th>Banco</th><th>Cant.</th><th>Saldo</th></tr></thead>
      <tbody id="filas"><tr><td colspan="4" class="vacio">Cargando…</td></tr></tbody>
    </table>
  </div>
  <p class="pie">Se actualiza solo cada minuto · <span id="hora"></span></p>
</main>
<script src="/panel/tienda.js" defer></script>
</body>
</html>
